name: Build Executables (Win & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: yandex2ytmusic-linux
            build_cmd: pyinstaller --noconfirm --onefile --collect-all playwright --collect-all ytmusicapi --name yandex2ytmusic main.py
          - os: windows-latest
            artifact_name: yandex2ytmusic-windows.exe
            build_cmd: pyinstaller --noconfirm --onefile --collect-all playwright --collect-all ytmusicapi --name yandex2ytmusic.exe main.py

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Browsers
        run: playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Build Executable
        run: ${{ matrix.build_cmd }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/yandex2ytmusic-windows.exe/yandex2ytmusic.exe
            artifacts/yandex2ytmusic-linux/yandex2ytmusic
          generate_release_notes: true
